services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_db}
      POSTGRES_USER: ${POSTGRES_USER:-document_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Isi POSTGRES_PASSWORD di .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL:? isi DATABASE_URL di .env}

    volumes:
      - document_uploads:/app/uploads
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro


volumes:
  postgres_data:
  document_uploads:

