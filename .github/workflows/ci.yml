name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: document_user
          POSTGRES_PASSWORD: document_pass
          POSTGRES_DB: document_test
        options: >-
          --health-cmd "pg_isready -U document_user -d document_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://document_user:document_pass@localhost:5432/document_test
          TEST_DATABASE_URL: postgresql+psycopg://document_user:document_pass@localhost:5432/document_test
        run: |
          python -m pytest -q